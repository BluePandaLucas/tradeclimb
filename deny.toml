[advisories]
version = 2
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Leptos 0.8 transitively requires the archived paste proc macro. No known vulnerability; remove when upstream migrates. Review on each Leptos upgrade." }]
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0"]
[bans]
multiple-versions = "allow"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
