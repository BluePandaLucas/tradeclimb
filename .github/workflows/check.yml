name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check
      - name: Configure local strategy isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap dbus-user-session
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Package browser and exercise real worker workflow
        run: |
          cargo build --locked --release --bin tc
          cargo build --manifest-path examples/strategy/Cargo.toml --release --locked
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          ./scripts/build-web
          python3 scripts/smoke.py
          python3 scripts/evaluation-smoke.py
          python3 scripts/kraken-smoke.py
          ./scripts/check-sandbox
          agent_test_data=$(mktemp -d)
          ./scripts/setup-agent "$agent_test_data"
          python3 scripts/security-smoke.py --agent-account tc-agent
          rm -rf "$agent_test_data"
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
