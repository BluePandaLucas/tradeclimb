worker_processes 1;
pid @RUNTIME@/tradeclimb-proxy/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path @RUNTIME@/tradeclimb-proxy/client;
    proxy_temp_path @RUNTIME@/tradeclimb-proxy/proxy;
    fastcgi_temp_path @RUNTIME@/tradeclimb-proxy/fastcgi;
    uwsgi_temp_path @RUNTIME@/tradeclimb-proxy/uwsgi;
    scgi_temp_path @RUNTIME@/tradeclimb-proxy/scgi;
    server {
        listen 8443 ssl;
        server_name @SERVER_NAMES@;
        ssl_certificate @CONFIG@/lan.crt;
        ssl_certificate_key @CONFIG@/lan.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        allow 127.0.0.1;
        allow @LAN_CIDR@;
        deny all;
        client_max_body_size 2m;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_cookie_flags tc_session secure httponly samesite=strict;
        }
    }
}
