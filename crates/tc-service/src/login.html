<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeClimb · Sign in</title><style>body{font:16px system-ui;background:#111a1e;color:#e3eae8;margin:0;display:grid;min-height:100vh;place-items:center}main{width:min(360px,calc(100% - 48px))}h1{font-size:28px}p{line-height:1.5;color:#aab9b6}label{display:grid;gap:8px}input,button{font:inherit;padding:12px;border-radius:6px;border:1px solid #455651}input{background:#19282b;color:inherit;min-width:0}button{background:#a9e2cb;color:#13251e;cursor:pointer;margin-top:16px;width:100%}#status{min-height:24px;color:#f0b8a4}</style></head><body><main><h1>TradeClimb</h1><p>Your private research workspace. Run <code>tc auth status</code> on this computer to locate your owner key.</p><form><label>Owner key<input type="password" name="key" autocomplete="off" maxlength="64" required></label><button>Sign in</button><p id="status" role="status"></p></form></main><script>document.querySelector('form').onsubmit=async event=>{event.preventDefault();const input=document.querySelector('input'),status=document.querySelector('#status'),button=document.querySelector('button');button.disabled=true;try{const response=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:input.value})});input.value='';if(response.ok){location.replace('/');return;}status.textContent='Sign-in failed. Check your owner key.';}catch{status.textContent='Unable to connect.';}button.disabled=false;};</script></body></html>
